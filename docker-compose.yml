services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wear-it-backend
    ports:
      - "127.0.0.1:4011:4011"
    environment:
      - PORT=4011
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
