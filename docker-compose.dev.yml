services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wear-it-backend-dev
    ports:
      - "127.0.0.1:4111:4111"
    environment:
      - PORT=4111
    env_file:
      - .env.dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
